# Conda environment for the thesis pipeline.
# Recreate with:  conda env create -f environment.yml
# Then:           conda activate machine_learning
#
# Pinned to the versions the thesis results were produced with (Python 3.10.18).
# Notebooks use the `machine_learning` kernelspec, matching the env name below.
name: machine_learning
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10.18
  - pip
  - pip:
      - ipywidgets==8.1.5
      - matplotlib==3.10.0
      - numpy==1.26.4
      - openpyxl==3.1.5
      - pandas==2.3.1
      - pillow==11.3.0
      - prophet==1.3.0
      - scikit-learn==1.7.1
      - scipy==1.15.3
      - seaborn==0.13.2
      - shap==0.48.0
      - statsmodels==0.14.6
      - xgboost==3.2.0
